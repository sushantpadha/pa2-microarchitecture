# Task 2B: Dynamic I-RRIP (set dueling), with a sensitivity study over >= 5 values
# of the decision parameter.
# PS.pdf asks for: IPC, speedup, L2C / L2 instruction / L2 data load MPKI.
#
# Final runs (default) use the spec's settings, which can't be set here:
#   every trace in ../traces/*.xz, 25M warmup, 25M simulation.
# The no/lru baseline always runs as config "base".

metrics = ["ipc", "speedup", "l2c_load_mpki", "l2c_instr_load_mpki", "l2c_data_load_mpki"]

# Settings for `--test` runs. Every key is optional; defaults shown.
[test]
# traces = ["../traces/*.xz"]   # globs, relative to the repo root
warmup = 1_000_000              # default 1_000_000
sim    = 5_000_000              # default 5_000_000

# DYN_THRESH is a placeholder: use the name the dyn_irrip code reads with getenv().
# A list is swept: this expands into configs dyn.DYN_THRESH=0.1 ... dyn.DYN_THRESH=0.4.
[config.dyn]
repl = "dyn_irrip"              # replacement/dyn_irrip.l2c_repl; default "lru"
# pf = "no"                     # default "no"
env = { DYN_THRESH = ["0.1", "0.2", "0.25", "0.3", "0.4"] }

# Static I-RRIP, to show what the dynamic switch adds.
# [config.irrip]
# repl = "irrip"
