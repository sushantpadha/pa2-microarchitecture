# Task 2B pilot: threshold T, at placement 0 (complement select), 32 leaders and
# epoch 1024. Whole-run ratios on the leaders: Trace3 ~0.31, Trace1 ~0.45,
# Trace2 ~0.61, so the 0.05 steps cover each trace's switch point.
# T = 0 should match irrip (minus the leader loss), T = 1 should match rrip.
# Final settings: every trace, 25M warmup, 25M simulation.

metrics = ["ipc", "speedup", "l2c_load_mpki", "l2c_instr_load_mpki", "l2c_data_load_mpki"]

[test]
warmup = 1_000_000
sim    = 5_000_000

[config.dyn]
repl = "dyn_irrip"
env = { DYN_PLACE = "0", DYN_LEADERS = "32", DYN_EPOCH = "1024", DYN_THRESH = ["0", "0.1", "0.15", "0.2", "0.25", "0.3", "0.35", "0.4", "0.45", "0.5", "0.55", "0.6", "0.65", "0.7", "1"] }

[config.irrip]
repl = "irrip"

[config.rrip]
repl = "rrip"
