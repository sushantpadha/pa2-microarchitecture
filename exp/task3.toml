# Task 3: SPP + prefetch-aware Dynamic I-RRIP. Must beat both SPP alone and
# Dynamic I-RRIP alone on IPC.
# PS.pdf asks for: IPC, speedup, prefetch accuracy, coverage, and load MPKI
# of L1D, L2C, L2 instruction, L2 data.
#
# Final runs (default) use the spec's settings, which can't be set here:
#   every trace in ../traces/Trace*.gz, 25M warmup, 25M simulation.
# The no/lru baseline always runs as config "base".
#
# dyn_irrip's prefetch knobs (defaults are the final values):
#   PF_INS = 1  a prefetch fill is inserted at the max RRPV (0: like other data)
#   PF_HIT = 1  a prefetch hit does not promote (0: promote like a data hit)
# Knob study: exp/task3_sweep.toml (all combinations, with the duel) and
# exp/task3_modes.toml (mode pinned to I-RRIP or RRIP), both on 3dyn_irrip.

metrics = ["ipc", "speedup", "l1d_accuracy_issued", "l1d_accuracy_resolved", "l1d_coverage", "l1d_load_mpki",
           "l2c_load_mpki", "l2c_instr_load_mpki", "l2c_data_load_mpki"]

# Settings for `--test` runs. Every key is optional; defaults shown.
[test]
# traces = ["../traces/Trace*.gz"]   # globs, relative to the repo root; e.g. ["../traces/Trace1.gz"]
warmup = 2_000_000              # default 2_000_000
sim    = 10_000_000             # default 10_000_000

[config.spp]                    # SPP alone (LRU at L2C)
pf = "spp"

[config.dyn]                    # Dynamic I-RRIP alone (no prefetcher, so the PF knobs never act)
repl = "dyn_irrip"

[config.spp_dyn_unaware]        # combination with prefetch awareness off
pf = "spp"
repl = "dyn_irrip"
env = { PF_INS = "0", PF_HIT = "0" }

[config.spp_dyn]                # combination, final policy (code defaults)
pf = "spp"
repl = "dyn_irrip"
