# Task 2B sweep for the report: threshold x leader count x epoch, placement 0
# (complement select), no hysteresis. Epoch is in leader accesses (not scaled
# with the leader count, unlike task2b_grid). I-RRIP branch = irrip lvl 8.
# Final settings: every trace, 25M warmup, 25M simulation.

metrics = ["ipc", "speedup", "l2c_load_mpki", "l2c_instr_load_mpki", "l2c_data_load_mpki"]

[test]
warmup = 1_000_000
sim    = 5_000_000

[config.n8]
repl = "dyn_irrip"
env = { DYN_PLACE = "0", DYN_LEADERS = "8", DYN_EPOCH = ["512", "1024", "2048"], DYN_THRESH = ["0", "0.15", "0.25", "0.4", "0.5"] }

[config.n16]
repl = "dyn_irrip"
env = { DYN_PLACE = "0", DYN_LEADERS = "16", DYN_EPOCH = ["512", "1024", "2048"], DYN_THRESH = ["0", "0.15", "0.25", "0.4", "0.5"] }

[config.n32]
repl = "dyn_irrip"
env = { DYN_PLACE = "0", DYN_LEADERS = "32", DYN_EPOCH = ["512", "1024", "2048"], DYN_THRESH = ["0", "0.15", "0.25", "0.4", "0.5"] }

[config.n64]
repl = "dyn_irrip"
env = { DYN_PLACE = "0", DYN_LEADERS = "64", DYN_EPOCH = ["512", "1024", "2048"], DYN_THRESH = ["0", "0.15", "0.25", "0.4", "0.5"] }


[config.irrip]
repl = "irrip"

[config.rrip]
repl = "rrip"
