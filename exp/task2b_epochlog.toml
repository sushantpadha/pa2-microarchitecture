# Task 2B per-decision log (DYN_LOG=1): r and the mode at every decision.
# plot1: 8 leaders, epoch 1024, T in {0.15, 0.25, 0.4}, h = 0, so every config
# matches task2b_sweep n8.DYN_EPOCH=1024.DYN_THRESH=* exactly (the log must not
# change results).
# Final settings: every trace, 25M warmup, 25M simulation.

metrics = ["ipc", "speedup", "l2c_load_mpki", "l2c_instr_load_mpki", "l2c_data_load_mpki"]

[test]
warmup = 1_000_000
sim    = 5_000_000

[config.plot1]
repl = "dyn_irrip"
env = { DYN_LOG = "1", DYN_HYST = "0", DYN_LEADERS = "8", DYN_EPOCH = "1024", DYN_THRESH = ["0.15", "0.25", "0.4"] }

[config.irrip]
repl = "irrip"

[config.rrip]
repl = "rrip"
